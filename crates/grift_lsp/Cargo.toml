[package]
name = "grift_lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language Server Protocol implementation for the Grift Lisp"

[[bin]]
name = "grift-lsp"
path = "src/main.rs"

[dependencies]
grift.workspace = true
grift_arena.workspace = true
grift_check = { version = "1.5.0", path = "../grift_check" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
